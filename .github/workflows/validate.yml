name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository
        run: python -m unittest discover -s tests -p '*.py' -v
      - name: Exercise helper entry points
        run: |
          python scripts/comi_preflight.py --help
          python scripts/run_cases.py --help
          python scripts/field_quality.py prepare --help
          python scripts/field_quality.py evaluate --help
